root = "."
tmp_dir = "tmp/gateway"

[build]
cmd = "go build -o ./tmp/gateway/gateway ./apps/gateway"
entrypoint = ["./tmp/gateway/gateway"]
delay = 200
exclude_dir = ["tmp", "internal/db/migrations", "k6"]
exclude_regex = ["_test\\.go"]
include_ext = ["go", "sql"]
stop_on_error = false
kill_delay = "5s"
send_interrupt = true

[log]
main_only = false

[misc]
clean_on_exit = true
