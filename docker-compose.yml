services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: maroonrides
      POSTGRES_PASSWORD: maroonrides
      POSTGRES_DB: maroonrides
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maroonrides -d maroonrides"]
      interval: 2s
      timeout: 3s
      retries: 15

  requester:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgres://maroonrides:maroonrides@postgres:5432/maroonrides?sslmode=disable
    volumes:
      - .:/app
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["air", "-c", ".air.gateway.toml"]
    environment:
      DATABASE_URL: postgres://maroonrides:maroonrides@postgres:5432/maroonrides?sslmode=disable
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  go-mod:
  go-build:
